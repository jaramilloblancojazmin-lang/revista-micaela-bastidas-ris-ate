<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071f2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Revista Micaela Bastidas | Prevención del Cáncer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071f2d}body{touch-action:none;font-family:system-ui,sans-serif}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.page{height:min(100dvh,177.68vw);width:min(100vw,56.28dvh);position:relative;box-shadow:0 0 30px #0005;overflow:hidden;background:white}canvas{width:100%;height:100%;display:block}.hit{position:fixed;top:0;bottom:0;width:17%;border:0;background:transparent;z-index:2;cursor:pointer}.hit.left{left:0}.hit.right{right:0}.counter{position:fixed;right:9px;top:max(9px,env(safe-area-inset-top));font-size:11px;background:#061c2b99;color:white;border-radius:12px;padding:5px 9px;pointer-events:none;z-index:3}.hint{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:20px;background:#061c2bba;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;z-index:3;transition:opacity .3s}.hint.hide{opacity:0}@media(prefers-reduced-motion:reduce){.hint{display:none}}

.controls{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:5;background:#061c2bc9;border:1px solid #ffffff45;border-radius:40px;padding:7px 10px;backdrop-filter:blur(8px)}.controls button,.controls a{border:0;border-radius:30px;color:white;background:#147d95;min-width:38px;min-height:38px;display:grid;place-items:center;text-decoration:none;font-size:20px;cursor:pointer}.controls button:disabled{opacity:.35}.controls .count{color:white;font-size:12px;min-width:38px;text-align:center}.hint{bottom:75px}.counter{display:none}.hit{width:11%;z-index:1}
</style></head><body><main class="stage"><div class="page" id="page"><canvas id="canvas" aria-label="Revista digital Centro de Salud Micaela Bastidas con efecto de hojas"></canvas></div></main><button class="hit left" id="prev" aria-label="Página anterior"></button><button class="hit right" id="next" aria-label="Página siguiente"></button><div class="counter" id="counter">1 / 4</div><div class="hint" id="hint">Desliza para pasar las hojas ↔</div><nav class="controls" aria-label="Controles de revista"><button id="backBtn" aria-label="Página anterior">❮</button><span class="count" id="pageCount">1 / 4</span><button id="forwardBtn" aria-label="Página siguiente">❯</button><button id="fullBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button><a href="revista-original.pdf" download aria-label="Descargar PDF" title="Descargar PDF" style="font-size:15px">PDF</a></nav>
<script>
(()=>{'use strict';
const sources=['pagina-1.jpg','pagina-2.jpg','pagina-3.jpg','pagina-4.jpg'];const images=sources.map(src=>{let i=new Image();i.src=src;return i});
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false}),holder=document.getElementById('page'),counter=document.getElementById('counter'),hint=document.getElementById('hint');let page=0,anim=null,drag=null,W=941,H=1672;
function resize(){const r=holder.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);W=canvas.width;H=canvas.height;draw()}window.addEventListener('resize',resize);
function paint(i){if(images[i]&&images[i].complete&&images[i].naturalWidth)ctx.drawImage(images[i],0,0,W,H);else{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}}
function shade(x,w,reverse=false){let g=ctx.createLinearGradient(x,0,x+w,0);if(!reverse){g.addColorStop(0,'rgba(0,0,0,.50)');g.addColorStop(.20,'rgba(0,0,0,.20)');g.addColorStop(.50,'rgba(255,255,255,.32)');g.addColorStop(.82,'rgba(0,0,0,.20)');g.addColorStop(1,'rgba(0,0,0,.48)')}else{g.addColorStop(0,'rgba(0,0,0,.40)');g.addColorStop(.35,'rgba(255,255,255,.26)');g.addColorStop(1,'rgba(0,0,0,.42)')}ctx.fillStyle=g;ctx.fillRect(x,0,w,H)}
function renderTurn(from,to,t,dir){paint(to);let c=W*.42, fold=dir===1?W-(W+c)*t:-c+(W+c)*t;let img=images[from];if(!img.complete||!img.naturalWidth)return;
ctx.save();ctx.beginPath();if(dir===1)ctx.rect(0,0,Math.max(0,fold),H);else ctx.rect(Math.min(W,fold+c),0,W,H);ctx.clip();ctx.drawImage(img,0,0,W,H);ctx.restore();
let a=Math.max(0,fold),b=Math.min(W,fold+c);if(b>a){let n=Math.ceil((b-a)/3),step=(b-a)/n;for(let j=0;j<n;j++){let xx=a+j*step;let u=(xx-fold)/c;let sx=dir===1?fold+c*(1-Math.cos(u*Math.PI/2)):fold+c*Math.cos(u*Math.PI/2);sx=Math.max(0,Math.min(W-1,sx));let sw=Math.max(1,c*Math.PI/2*Math.sin(Math.max(.02,u)*Math.PI/2)*step/c);ctx.drawImage(img,sx,0,Math.min(sw,W-sx),img.naturalHeight,xx,0,step+1,H)}shade(a,b-a,dir!==1);
ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#fff';ctx.fillRect(a,0,b-a,H);ctx.restore();}
let edge=dir===1?fold:fold+c;let sh=ctx.createLinearGradient(edge-35,0,edge+35,0);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.5,'rgba(0,0,0,.30)');sh.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sh;ctx.fillRect(Math.max(0,edge-35),0,70,H);
}
function draw(){if(anim){renderTurn(anim.from,anim.to,anim.t,anim.dir)}else paint(page);counter.textContent=(page+1)+' / 4';document.getElementById('pageCount').textContent=(page+1)+' / 4';document.getElementById('backBtn').disabled=page===0;document.getElementById('forwardBtn').disabled=page===images.length-1}
function finish(){if(!anim)return;page=anim.to;anim=null;draw()}
function go(dir){if(anim||drag||page+dir<0||page+dir>=images.length)return;hint.classList.add('hide');const from=page,to=page+dir,start=performance.now(),duration=1050;anim={from,to,t:0,dir};function frame(now){if(!anim||anim.from!==from)return;let u=Math.min(1,(now-start)/duration);anim.t=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;draw();if(u<1)requestAnimationFrame(frame);else finish()}requestAnimationFrame(frame)}
document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('backBtn').onclick=()=>go(-1);document.getElementById('forwardBtn').onclick=()=>go(1);document.getElementById('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});};
let startX=null,startY=null;document.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(startX===null)return;let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=null;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.1)go(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
images.forEach(i=>{i.onload=draw});resize();
})();
</script></body></html>
